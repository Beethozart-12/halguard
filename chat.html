<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HalGuard 聊天客户端</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --border: #2a2f3d;
    --text: #e6e9f0; --muted: #8b93a7; --accent: #4f8cff;
    --ok: #3fbf7f; --warn: #e6a23c; --bad: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--panel);
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .cfg { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .cfg label { font-size: 12px; color: var(--muted); }
  .cfg input {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 9px; font-size: 12px; width: 190px;
  }
  .cfg input#model { width: 110px; }
  .switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch .track {
    width: 34px; height: 18px; border-radius: 20px; background: var(--border);
    position: relative; transition: background .15s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--text); transition: left .15s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { left: 18px; }
  .switch input:disabled + .track { opacity: .4; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  #dot.ok { background: var(--ok); } #dot.bad { background: var(--bad); }
  #status { font-size: 12px; color: var(--muted); }

  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.65; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #2b4a8f; border-bottom-right-radius: 3px; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .hg {
    margin-top: 10px; padding: 8px 10px; border-radius: 8px; font-size: 12px;
    background: #10131a; border: 1px solid var(--border);
  }
  .hg .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .pill { padding: 1px 8px; border-radius: 20px; font-size: 11px; }
  .pill.low  { background: rgba(63,191,127,.15); color: var(--ok); }
  .pill.mid  { background: rgba(230,162,60,.15); color: var(--warn); }
  .pill.high { background: rgba(229,72,77,.18); color: var(--bad); }
  .pill.act  { background: rgba(79,140,255,.15); color: var(--accent); }
  .hg .claims { margin-top: 4px; }
  .hg .claims li { margin-left: 16px; color: var(--muted); }
  .hg .claims li.bad { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12px; }

  form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--panel); }
  #input {
    flex: 1; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; font-size: 14px; resize: none; height: 52px;
    font-family: inherit;
  }
  #input:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 0 22px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>🛡️ <span>HalGuard</span> 聊天</h1>
  <span id="dot"></span><span id="status">连接中…</span>
  <div class="cfg">
    <label>服务地址</label><input id="baseUrl" value="http://localhost:8849/v1">
    <label>模型</label><input id="model" value="qwen3:4b">
    <label class="switch" title="开启后每次提问先联网搜索，强制模型仅依据搜索结果作答并标注来源">
      <input type="checkbox" id="websearch"><span class="track"></span>
      <span style="font-size:12px;color:var(--muted)">🌐 联网搜索</span>
    </label>
  </div>
</header>

<div id="chat">
  <div class="msg bot hint">已接入 HalGuard 抗幻觉代理：回答基于本地知识库并自动标注来源 [n]，编造内容会被 ❌ 标出；<br>顶栏打开 <b>🌐 联网搜索</b> 后，每次提问先搜索网页，并强制模型仅依据搜索结果作答。</div>
</div>

<form id="f">
  <textarea id="input" placeholder="输入问题，回车发送（Shift+回车换行）"></textarea>
  <button id="send">发送</button>
</form>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const dot = document.getElementById('dot');
const statusEl = document.getElementById('status');
let history = [];

async function checkHealth() {
  const base = document.getElementById('baseUrl').value.replace(/\/v1\/?$/, '');
  try {
    const r = await fetch(base + '/health', { signal: AbortSignal.timeout(4000) });
    const d = await r.json();
    dot.className = 'ok';
    statusEl.textContent = `服务正常 · 嵌入器 ${d.embedder} · 模型 ${d.backend_model} · 知识库 ${d.kb_chunks} 块`;
  } catch (e) {
    dot.className = 'bad';
    statusEl.textContent = '服务未连接（确认容器已启动）';
  }
}
setInterval(checkHealth, 10000);
checkHealth();

function riskClass(r) { return r < 0.15 ? 'low' : r < 0.5 ? 'mid' : 'high'; }

function addHgPanel(el, hg) {
  if (!hg) return;
  const box = document.createElement('div');
  box.className = 'hg';
  const risk = typeof hg.risk === 'number' ? hg.risk : 0;
  let html = `<div class="row">
    <span class="pill ${riskClass(risk)}">幻觉风险 ${(risk * 100).toFixed(0)}%</span>
    ${hg.action && hg.action !== 'none' ? `<span class="pill act">动作: ${hg.action}</span>` : ''}
    ${hg.websearch?.enabled ? `<span class="pill act">🌐 联网${hg.websearch.failed ? '（搜索失败）' : `· ${hg.websearch.sources?.length || 0} 条来源`}</span>` : ''}
  </div>`;
  const srcs = hg.websearch?.sources || [];
  if (srcs.length) {
    html += '<div class="claims"><b>🌐 搜索来源：</b><ul>' +
      srcs.slice(0, 5).map((s, i) =>
        `<li><a href="${escapeHtml(s.url)}" target="_blank" style="color:var(--accent)">[${i + 1}] ${escapeHtml(s.title)}</a>${s.time ? ` <span class="hint">(${escapeHtml(s.time)})</span>` : ''}</li>`
      ).join('') + '</ul></div>';
  }
  const bad = (hg.claims || []).filter(c => c.unsupported);
  if (bad.length) {
    html += '<div class="claims"><b>❌ 疑似幻觉断言：</b><ul>' +
      bad.map(c => `<li class="bad">${escapeHtml(c.claim)} <span class="hint">(支持度 ${c.support?.toFixed?.(2) ?? c.support})</span></li>`).join('') + '</ul></div>';
  }
  if (hg.warning) html += `<div class="hint" style="margin-top:4px">${escapeHtml(String(hg.warning).slice(0, 300))}</div>`;
  box.innerHTML = html;
  el.appendChild(box);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function addMsg(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

async function send() {
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  sendBtn.disabled = true;
  addMsg('user', q);
  const wsOn = document.getElementById('websearch').checked;
  const botEl = addMsg('bot', wsOn ? '🌐 联网搜索中，随后思考…' : '思考中…');
  history.push({ role: 'user', content: q });

  const base = document.getElementById('baseUrl').value.replace(/\/+$/, '');
  const model = document.getElementById('model').value;
  try {
    const r = await fetch(base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer local' },
      // 联网模式：服务端会保证 max_tokens 下限（4096）并在思考耗尽预算时自动重试；
      // 客户端预算也给足，避免思考模型（qwen3 等）推理耗尽预算导致正文为空
      body: JSON.stringify({ model, messages: history, stream: false, max_tokens: wsOn ? 4000 : 1500, websearch: wsOn }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 200));
    const d = await r.json();
    let content = d.choices?.[0]?.message?.content ?? '(空回答)';
    // qwen3 思考模型可能返回 <think> 段，剥离展示
    content = content.replace(/<think>[\s\S]*?<\/think>/g, '').trim() || '(仅思考，无正文)';
    botEl.textContent = content;
    addHgPanel(botEl, d.halguard);
    history.push({ role: 'assistant', content });
  } catch (e) {
    botEl.textContent = '❌ 请求失败：' + e.message;
  } finally {
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    input.focus();
  }
}

document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); send(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.focus();
</script>
</body>
</html>
