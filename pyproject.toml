[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "halguard"
version = "0.1.0"
description = "Local LLM/SLM hallucination-reduction middleware: RAG grounding + post-generation verification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
quality = ["sentence-transformers>=2.3", "faiss-cpu>=1.7"]

[project.scripts]
halguard = "halguard.cli:main"

[tool.setuptools]
packages = ["halguard"]
